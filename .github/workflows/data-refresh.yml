name: Upstream data refresh

# Palworld patches change the game data, and upstream re-scrapes on its own
# schedule. Without this, the dataset silently goes stale and nothing says so.
#
# The workflow only ever opens a PR — it never commits to main. Review of the
# generated diff is the whole point: a bad upstream change should be visible
# before it ships, which is also why src/data/game-data.json is committed.
on:
  schedule:
    # Mondays, 06:00 UTC. Upstream updates far less often than daily.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Re-import and open a PR on any change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Re-import from upstream
        # validate.ts fails the import on cycles, dangling references, or
        # undefined nullables, so a broken upstream stops here rather than
        # producing a PR full of nonsense.
        run: npm run data:import

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet -- src/data/game-data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dataset unchanged."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo 'stat<<EOF'
              git diff --stat -- src/data/game-data.json
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Audit the refreshed data
        if: steps.check.outputs.changed == 'true'
        id: audit
        # Captured rather than gating: the audit's verdict belongs in the PR
        # body where it can be read against the diff. CI on the PR is the gate.
        run: |
          set +e
          npm run data:audit > audit.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          {
            echo 'report<<EOF'
            sed -n '/^Verdict/,$p' audit.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          cat audit.txt

      - name: Open or update the refresh PR
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed as environment rather than interpolated into the script, so
          # upstream text can never be parsed as shell.
          DIFF_STAT: ${{ steps.check.outputs.stat }}
          AUDIT_REPORT: ${{ steps.audit.outputs.report }}
        run: |
          set -euo pipefail
          BRANCH=chore/data-refresh
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add src/data/game-data.json
          git commit \
            -m "chore(data): refresh from upstream" \
            -m "Generated by the scheduled upstream refresh workflow." \
            -m "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"

          # Force-push a fixed branch so repeated runs update one PR rather
          # than accumulating a pile of near-identical ones. Never main.
          git push --force origin "$BRANCH"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "PR already open for $BRANCH; it now points at the latest data."
            exit 0
          fi

          {
            cat <<'HEADER'
          Automated refresh of `src/data/game-data.json` from upstream.

          **Review the diff before merging.** Upstream is scraped from paldb.cc, and
          scraping has previously lost information in ways that produced impossible
          recipes — see the flattened-alternatives section of CLAUDE.md. The import
          already passed cycle, dangling-reference, and nullable validation, but a
          plausible-looking wrong quantity would not be caught by any of that.

          Worth checking:
          - large swings in the classification counts below
          - new entries in the requisition for a familiar build
          - anything newly `unobtainable` that previously had a source

          ### Changed files
          HEADER
            printf '```\n%s\n```\n\n### Audit\n```\n%s\n```\n' "$DIFF_STAT" "$AUDIT_REPORT"
          } > body.md

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(data): refresh from upstream" \
            --body-file body.md

      - name: Report no-op
        if: steps.check.outputs.changed == 'false'
        run: echo "Upstream data is unchanged — nothing to do."
