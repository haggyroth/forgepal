name: Upstream data refresh

# Palworld patches change the game data, and upstream re-scrapes on its own
# schedule. Without this, the dataset silently goes stale and nothing says so.
#
# The importer pins upstream to a commit sha (see scripts/import/sources/
# palworld-kb.ts), so this job's first task is to find out whether that pin has
# moved. It proposes the new pin and the regenerated data together, in one PR,
# so the upstream change is reviewable rather than only its downstream effect.
#
# The workflow only ever opens a PR — it never commits to main. Review of the
# generated diff is the whole point: a bad upstream change should be visible
# before it ships, which is also why src/data/*.json is committed.
on:
  schedule:
    # Mondays, 06:00 UTC. Upstream updates far less often than daily.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Re-import and open a PR on any change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check whether the upstream pin has moved
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SOURCE=scripts/import/sources/palworld-kb.ts

          pinned=$(grep -oE "^const REF = '[0-9a-f]{40}'" "$SOURCE" | grep -oE "[0-9a-f]{40}")
          latest=$(gh api repos/beliarance/palworld-kb/commits/main --jq '.sha')

          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Pinned at $pinned"
          echo "Upstream  $latest"

          if [ "$pinned" = "$latest" ]; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
          else
            echo "moved=true" >> "$GITHUB_OUTPUT"
            # Bump the pin in the working tree so the import below runs against
            # the new upstream. Committed only if the data actually changes.
            sed -i "s/^const REF = '$pinned'/const REF = '$latest'/" "$SOURCE"
          fi

      - name: Re-import from upstream
        if: steps.upstream.outputs.moved == 'true'
        # validate.ts fails the import on cycles, dangling references, or
        # undefined nullables, so a broken upstream stops here rather than
        # producing a PR full of nonsense.
        run: npm run data:import

      - name: Check for changes
        id: check
        if: steps.upstream.outputs.moved == 'true'
        run: |
          set -euo pipefail
          # All three generated files, not just game-data.json. Watching only
          # that one meant a change confined to breeding-data.json was reported
          # as "no change" and never proposed.
          if git diff --quiet -- src/data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Upstream moved but the generated data is identical."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo 'stat<<EOF'
              git diff --stat -- src/data/
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Audit the refreshed data
        if: steps.check.outputs.changed == 'true'
        id: audit
        # Captured rather than gating: the audit's verdict belongs in the PR
        # body where it can be read against the diff. CI on the PR is the gate.
        run: |
          set +e
          npm run data:audit > audit.txt 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          {
            echo 'report<<EOF'
            sed -n '/^Verdict/,$p' audit.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          cat audit.txt

      - name: Open or update the refresh PR
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed as environment rather than interpolated into the script, so
          # upstream text can never be parsed as shell.
          DIFF_STAT: ${{ steps.check.outputs.stat }}
          AUDIT_REPORT: ${{ steps.audit.outputs.report }}
          PINNED: ${{ steps.upstream.outputs.pinned }}
          LATEST: ${{ steps.upstream.outputs.latest }}
        run: |
          set -euo pipefail
          BRANCH=chore/data-refresh
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          # The pin and the data it produced, staged together — the pin bump is
          # what makes the data change reproducible.
          git add src/data/ scripts/import/sources/palworld-kb.ts
          git commit \
            -m "chore(data): refresh from upstream" \
            -m "Upstream pin ${PINNED} -> ${LATEST}." \
            -m "Generated by the scheduled upstream refresh workflow." \
            -m "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"

          # Force-push a fixed branch so repeated runs update one PR rather
          # than accumulating a pile of near-identical ones. Never main.
          git push --force origin "$BRANCH"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "PR already open for $BRANCH; it now points at the latest data."
            exit 0
          fi

          {
            cat <<'HEADER'
          Automated refresh of the generated datasets from upstream.

          **Review the diff before merging.** Upstream is scraped from paldb.cc, and
          scraping has previously lost information in ways that produced impossible
          recipes — see the flattened-alternatives section of CLAUDE.md. The import
          already passed cycle, dangling-reference, and nullable validation, but a
          plausible-looking wrong quantity would not be caught by any of that.

          Worth checking:
          - large swings in the classification counts below
          - new entries in the requisition for a familiar build
          - anything newly `unobtainable` that previously had a source

          ### Upstream pin
          HEADER
            printf '`%s` -> `%s`\n\n### Changed files\n' "$PINNED" "$LATEST"
            printf '```\n%s\n```\n\n### Audit\n```\n%s\n```\n' "$DIFF_STAT" "$AUDIT_REPORT"
          } > body.md

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(data): refresh from upstream" \
            --body-file body.md

      - name: Report no-op
        if: steps.upstream.outputs.moved == 'false' || steps.check.outputs.changed == 'false'
        run: |
          if [ "${{ steps.upstream.outputs.moved }}" = "false" ]; then
            echo "Upstream pin is current — nothing to do."
          else
            # The pin moved but the generated output did not, so the bump is left
            # unproposed rather than opening a weekly PR for a doc-only upstream
            # change. The pin stays on an older commit that produces identical
            # data, and the next data-affecting change carries it forward.
            echo "Upstream moved but the generated data is identical — pin left alone."
          fi
