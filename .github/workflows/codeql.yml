name: CodeQL

# Static analysis for JavaScript/TypeScript. Runs on pushes to main, on every
# PR, and weekly — the schedule matters because CodeQL's query packs are updated
# independently of this repo, so a scan can find something in code that has not
# changed since the last run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays, 08:00 UTC — after the data refresh and Dependabot windows.
    - cron: '0 8 * * 1'

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          # security-and-quality is broader than the default security-extended
          # and includes maintainability queries, which suits a project this
          # size where the noise is manageable. The config file records the one
          # query we exclude, and why.
          config-file: ./.github/codeql/codeql-config.yml

      # No build step: CodeQL's JS/TS extractor reads source directly, and
      # building would only add the bundled dataset to what it has to scan.
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:javascript-typescript
