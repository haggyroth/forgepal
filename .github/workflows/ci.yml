name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Fails only on problems within our control — a stale curated override,
      # or upstream text matching a pattern we claim to parse but didn't.
      # Upstream's own gaps are reported, not treated as failures.
      - name: Audit data quality
        run: npm run data:audit

      - name: Build
        run: npm run build
