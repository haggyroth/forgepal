name: E2E

# Its own workflow rather than a job in CI, for two reasons.
#
# The first is the one the issue asked for: a flaky browser test must not block
# the lint/test/build gate, and "Lint, test, build" is a required status check.
#
# The second only became true when the deploy started gating on CI. deploy.yml
# triggers on CI's *workflow conclusion*, so an e2e job living inside ci.yml
# would make a flaky browser test block production deploys as well as merges.
# Keeping it separate means it reports independently and gates neither.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve the Playwright version
        id: pw
        # Cache key must track the exact version, or a Playwright bump silently
        # restores browsers built for the previous one.
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Chromium only — this suite checks composition and the production base
      # path, not cross-browser rendering. Three engines would triple the time
      # for coverage the unit suite provides differently.
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # System deps are not part of the cached browser directory, so they still
      # need installing on a cache hit.
      - name: Install system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run end-to-end tests
        # playwright.config.ts builds with GITHUB_ACTIONS=1 and previews with it
        # too, so these run against /forgepal/ — the path production serves.
        run: npm run test:e2e

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
